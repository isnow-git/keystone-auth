spring:
  application:
    name: keystone-auth
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/keystone}
    username: ${DB_USER:keystone}
    password: ${DB_PASSWORD:keystone}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  jooq:
    sql-dialect: postgres

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

keystone:
  jwt:
    issuer: ${JWT_ISSUER:keystone-auth}
    access-token-ttl: PT15M
    refresh-token-ttl: P7D
    key-id: ${JWT_KEY_ID:keystone-key-1}
    private-key-path: ${JWT_PRIVATE_KEY_PATH:keys/private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:keys/public.pem}
  rate-limit:
    login:
      capacity: 5
      refill-tokens: 5
      refill-period: PT1M
    register:
      capacity: 3
      refill-tokens: 3
      refill-period: PT1H
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
    allowed-methods: GET,POST
    max-age: 3600

logging:
  level:
    root: INFO
    com.keystone.auth: DEBUG
    org.springframework.security: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
    try-it-out-enabled: true
